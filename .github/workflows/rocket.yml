name: Generate Rocket Contribution Graph

on:
  schedule:
    - cron: "0 0,12 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Several workflows (snake, rocket, 3d-contrib, terminal-card, rpg-sheet) all
# publish generated SVGs to the shared "output" branch. Serialize them so a
# concurrent push from one never race-clobbers another's commit.
concurrency:
  group: output-branch-deploy
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate rocket SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          node scripts/rocket-graph.mjs "${{ github.repository_owner }}" dark  > dist/rocket-dark.svg
          node scripts/rocket-graph.mjs "${{ github.repository_owner }}" light > dist/rocket-light.svg

      - name: Push generated files to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
          keep_files: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "chore: update rocket contribution graph"
