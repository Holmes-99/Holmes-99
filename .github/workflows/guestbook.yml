name: Update Guestbook

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

# A new guestbook issue fires both "opened" and "labeled" (the template
# auto-applies the guestbook label), so two runs can start seconds apart and
# race to push README.md. Serialize them instead of letting the second
# push get rejected.
concurrency:
  group: guestbook-readme
  cancel-in-progress: false

jobs:
  update-guestbook:
    # Only bother running the whole thing for guestbook-labeled issues (or a
    # manual dispatch to force a refresh, e.g. after editing an entry).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'guestbook')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rewrite guestbook table in README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/guestbook.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "No guestbook changes."
          else
            git add README.md
            git commit -m "chore: update guestbook"
            git push
          fi
